name: Tests

on:
  workflow_call:
    inputs:
      php:
        default: "8.3"
        type: string
      node:
        default: "22"
        type: string
    secrets:
      COMPOSER_AUTH_JSON:
        required: false

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php }}
          tools: composer:v2
          coverage: none

      - name: Setup Node and NPM
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node }}

      - name: Configure Composer Authentication (optional)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.composer"

          if [ -n "${{ secrets.COMPOSER_AUTH_JSON }}" ]; then
            cat > "$HOME/.composer/auth.json" <<'JSON'
          ${{ secrets.COMPOSER_AUTH_JSON }}
          JSON
            echo "Composer auth configured via COMPOSER_AUTH_JSON."
          else
            echo "No Composer auth secrets provided. Continuing without private package auth."
          fi

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install and Build NPM Dependencies
        run: |
          npm ci
          npm run build

      - name: Prepare Application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --seed

      - name: Run Tests
        run: php artisan test

      - name: Type Checking
        run: vendor/bin/phpstan --verbose
